<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Whisper et openWakeWord lisent le runtime ONNX et leurs modèles via jarvis-oww:
      (extraResources, hors asar). Aucun CDN. blob: : fabrique .mjs d'onnxruntime-web.
      'wasm-unsafe-eval' : compilation WebAssembly. connect-src https: : recherche web.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' jarvis-oww:; script-src 'self' 'wasm-unsafe-eval' jarvis-oww: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' jarvis-oww: https: wss: blob:; worker-src 'self' blob: jarvis-oww:"
    />
    <title>Jarvis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
