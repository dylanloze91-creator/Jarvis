<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      script-src/connect-src/worker-src élargis à jsDelivr et Hugging Face :
      seule dérogation à « self » de toute l'application, nécessaire pour
      Whisper local (transformers.js, chargé depuis un CDN pour ne pas
      alourdir l'installateur — voir voice/whisper/pipelineLoader.ts) et le
      téléchargement de ses poids de modèle au premier usage. connect-src
      autorise aussi https: en général : les poids sont servis par le CDN de
      stockage de Hugging Face, dont les sous-domaines varient (répartition
      de charge) et ne peuvent pas être listés un par un de façon fiable.
      blob: (script-src et worker-src) : les workers d'onnxruntime-web sont
      instanciés depuis un Blob, pas un fichier. 'wasm-unsafe-eval' :
      directive CSP dédiée à la compilation WebAssembly (distincte du
      'unsafe-eval' générique, qui autoriserait aussi eval()/Function() —
      non nécessaire ici) ; sans elle, WebAssembly.instantiate() échoue avec
      une CompileError — vérifié en conditions réelles (Electron, DISPLAY:1).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:"
    />
    <title>Jarvis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
