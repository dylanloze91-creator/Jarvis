; Enceinte Jarvis (5.0.64) — carte ESP32-S3 avec micro INMP441 et ampli MAX98357A.
;
; Cadre : ESP-IDF (pas Arduino). Raison : le mot de réveil « Jarvis » est un modèle officiel
; d'Espressif (ESP-SR, `wn9_jarvis_tts`) qui se choisit dans la configuration du projet
; (`sdkconfig.defaults`, CONFIG_SR_WN_WN9_JARVIS_TTS). Le cœur Arduino-ESP32 3.x est précompilé
; avec un seul mot de réveil (« Hi, ESP ») : « Jarvis » n'y est pas accessible.
;
; Carte visée : ESP32-S3-DevKitC-1 N8R8 d'Espressif (8 Mo de flash, 8 Mo de PSRAM octale) ; une
; N16R8 marche aussi telle quelle. La PSRAM est nécessaire (modèle de réveil + 15 s d'audio).

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -I include
; Le modèle de réveil (srmodels.bin) est écrit dans la partition « model » lors du téléversement.
extra_scripts = post:flash_models.py
